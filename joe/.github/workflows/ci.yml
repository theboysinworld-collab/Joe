name: joe-ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Instalar (somente stdlib + pytest + cobertura)
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
          pip install -e . || true
      - name: Boot de verificação
        run: python run.py --check
      - name: Suíte completa com cobertura (piso >= 85%)
        run: pytest tests/ -q --cov=joe --cov-report=term --cov-fail-under=85
      - name: Smoke E2E offline (planner determinístico)
        run: |
          python run.py --once "lembre-se que meu apelido é teste-ci"
          python run.py --health
