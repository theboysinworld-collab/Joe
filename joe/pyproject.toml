[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "joe-agent"
version = "0.1.0"
description = "Joe — IDE, assistente pessoal e agente geral no terminal"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Joe" }]
keywords = ["agent", "cli", "ide", "assistant", "llm", "automation"]
classifiers = [
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Software Development :: User Interfaces",
]
dependencies = []

[project.optional-dependencies]
rich = ["rich>=13"]
vision = ["pillow>=10", "pytesseract>=0.3.10"]
speech = ["pyttsx3>=2.90", "piper-tts>=1.8.0; python_version < '3.15'"]
vector = ["numpy>=1.26"]
all = [
  "rich>=13",
  "pillow>=10",
  "pytesseract>=0.3.10",
  "pyttsx3>=2.90",
  "piper-tts>=1.8.0; python_version < '3.15'",
  "numpy>=1.26",
]
test = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
joe = "joe.cli:main"

[tool.setuptools.packages.find]
include = ["joe*"]

[tool.setuptools.package-data]
joe = ["web_ui.html"]
